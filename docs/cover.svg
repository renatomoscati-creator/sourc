  <text x="100" y="314" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#71717a">Self-hosted &#183; SQLite &#183; bring your own model</text>

  <!-- stack chips -->
