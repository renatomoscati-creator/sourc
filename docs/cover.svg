  </defs>

  <rect width="1280" height="420" fill="url(#bg)"/>

  <!-- faint kanban / pipeline motif, right side -->
  <g opacity="0.16" stroke="#3f3f46" stroke-width="1.5" fill="none">
    <rect x="812"  y="96"  width="96" height="228" rx="10"/>
    <rect x="924"  y="96"  width="96" height="228" rx="10"/>
    <rect x="1036" y="96"  width="96" height="228" rx="10"/>
    <rect x="1148" y="96"  width="96" height="228" rx="10"/>
  </g>
  <g opacity="0.5" fill="#18181b" stroke="#27272a" stroke-width="1.5">
    <rect x="824"  y="112" width="72" height="40" rx="7"/>
    <rect x="824"  y="160" width="72" height="40" rx="7"/>
    <rect x="936"  y="112" width="72" height="40" rx="7"/>
    <rect x="1048" y="112" width="72" height="40" rx="7"/>
